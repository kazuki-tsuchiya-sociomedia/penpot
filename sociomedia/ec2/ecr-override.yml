# /home/ubuntu/penpot/ecr-override.yml として配置する。
#
# deploy.sh が初回デプロイ時に docker-compose.override.yml としてコピーする。
# docker compose は同じディレクトリの docker-compose.override.yml を自動で
# 重ねて読み込むため、本体の docker-compose.yml は変更せずに、自前ビルドの
# イメージ (ECR) へ差し替えられる。override を消せば公式イメージに戻る。
#
# PENPOT_CUSTOM_VERSION は deploy.sh が .env に書き込む。
# admin-console は本家の非公開リポジトリでビルドされるため公式イメージのまま。

services:
  penpot-frontend:
    image: "045084157533.dkr.ecr.ap-northeast-1.amazonaws.com/penpot/frontend:${PENPOT_CUSTOM_VERSION:?PENPOT_CUSTOM_VERSION is not set}"

    # hide-ui.css (このファイルと同じディレクトリに配置) を index.html から
    # 読み込ませ、本家の Enterprise 向け案内を隠す。brand-symbols.svg で
    # ロゴ部品も差し替える。イメージ本来の /entrypoint.sh の前に一段
    # はさむだけで、最後に必ずそちらへ処理を渡す。
    #
    # - index.html は no-store で配信されるので、再起動すればすぐ反映される。
    #   CSS 側は 7 日キャッシュされるため、内容のチェックサムを ?v= に付ける。
    # - hide-ui.css が無いとき (docker は代わりに空ディレクトリを作る) は
    #   何もせずに起動する。表示が隠れないだけで、Penpot は止まらない。
    # - `$$` は compose の変数展開を避けるためのエスケープ。
    volumes:
      - ./hide-ui.css:/sociomedia/hide-ui.css:ro
      - ./brand-symbols.svg:/sociomedia/brand-symbols.svg:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        src=/sociomedia/hide-ui.css
        app=/var/www/app
        if [[ -f "$$src" && -w "$$app/index.html" ]]; then
          cp "$$src" "$$app/css/sociomedia-hide-ui.css"
          v="$$(cksum < "$$src" | cut -d' ' -f1)"
          link="<link id=\"sociomedia-hide-ui\" rel=\"stylesheet\" href=\"css/sociomedia-hide-ui.css?v=$$v\" />"
          sed -i \
            -e 's|<link id="sociomedia-hide-ui"[^>]*/>||' \
            -e "s|</head>|$$link</head>|" \
            "$$app/index.html"
          echo "sociomedia: hide-ui.css installed (v=$$v)"
        else
          echo "sociomedia: hide-ui.css not installed" >&2
        fi
        # brand-symbols.svg (同じディレクトリに配置) の <symbol> を <body> 直後に
        # 差し込み、本家のロゴ部品を同じ id で上書きする。再起動時は前回の
        # 差し込み (id="sociomedia-brand") を取り除いてから入れ直す。
        brand=/sociomedia/brand-symbols.svg
        if [[ -f "$$brand" && -w "$$app/index.html" ]]; then
          perl -0pi -e '
            BEGIN { open(my $$f, "<", "/sociomedia/brand-symbols.svg") or die; local $$/; $$b = <$$f>; close $$f;
                    $$b =~ s/<!--.*?-->//gs; $$b =~ s/\s+/ /g; $$b =~ s/^ | $$//g; }
            s{<svg id="sociomedia-brand".*?</svg>}{}s;
            s{<body>}{<body>$$b}s;
          ' "$$app/index.html"
          echo "sociomedia: brand-symbols.svg installed ($$(grep -o '<symbol id=\"[^\"]*\"' "$$brand" | tr '\n' ' '))"
        else
          echo "sociomedia: brand-symbols.svg not installed" >&2
        fi
        exec /bin/bash /entrypoint.sh "$$@"
      - --
    command: ["nginx", "-g", "daemon off;"]

  penpot-backend:
    image: "045084157533.dkr.ecr.ap-northeast-1.amazonaws.com/penpot/backend:${PENPOT_CUSTOM_VERSION:?PENPOT_CUSTOM_VERSION is not set}"

  penpot-exporter:
    image: "045084157533.dkr.ecr.ap-northeast-1.amazonaws.com/penpot/exporter:${PENPOT_CUSTOM_VERSION:?PENPOT_CUSTOM_VERSION is not set}"

  penpot-mcp:
    image: "045084157533.dkr.ecr.ap-northeast-1.amazonaws.com/penpot/mcp:${PENPOT_CUSTOM_VERSION:?PENPOT_CUSTOM_VERSION is not set}"
