name: sociomedia / Build & Deploy

run-name: >-
  sociomedia / Build & Deploy (${{ github.ref_name }} @ ${{ github.sha }})

# sociomedia/main への push で arm64 イメージをビルドして ECR に push し、
# SSM 経由で EC2 (t4g.medium) に反映する。
on:
  push:
    branches:
      - sociomedia/main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'ビルド後に EC2 へデプロイする'
        type: boolean
        required: false
        default: true

concurrency:
  group: sociomedia-build-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  AWS_ROLE_ARN: arn:aws:iam::045084157533:role/penpot-github-actions
  ECR_REGISTRY: 045084157533.dkr.ecr.ap-northeast-1.amazonaws.com
  ECR_PREFIX: penpot
  EC2_INSTANCE_ID: i-083937308e9a91b57
  # deploy.sh <tag> だけを実行できる専用の SSM ドキュメント (sociomedia/aws/ssm-deploy-document.json)
  SSM_DOCUMENT: penpot-deploy

jobs:
  build:
    name: Build bundles & arm64 images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # フォークにはタグを push しない (本家の build-tag.yml が起動するため)。
      # バージョン番号 (git describe) の算出用に本家のタグだけ取得する。
      - name: Fetch upstream tags
        run: git fetch --no-tags https://github.com/penpot/penpot.git '+refs/tags/*:refs/tags/*'

      - name: Resolve version
        id: version
        run: |
          VERSION="$(git describe --tags --match '*.*.*')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # 公開されている devenv イメージは develop 向けの latest のみで、
      # CARGO_HOME (/opt/cargo) が root 所有のため、追加の crate を取得できない。
      - name: Prepare devenv image
        run: |
          docker pull penpotapp/devenv:latest
          printf 'FROM penpotapp/devenv:latest\nRUN chmod -R a+rwX /opt/cargo\n' \
            | docker build -t penpotapp/devenv:latest -

      - name: Build bundles
        run: |
          ./manage.sh build-frontend-bundle
          ./manage.sh build-backend-bundle
          ./manage.sh build-exporter-bundle
          ./manage.sh build-mcp-bundle

      # sociomedia/ec2/hide-ui.css は本家の CSS クラス名に依存する。本家が名前を
      # 変えると黙って効かなくなるので、イメージを push する前にここで止める。
      - name: Check hide-ui.css selectors
        run: |
          missing=0
          for class in $(grep -oE '\.main_ui_[A-Za-z0-9_-]+' sociomedia/ec2/hide-ui.css | sort -u); do
            if ! grep -qF -- "$class" ./bundles/frontend/css/main.css; then
              echo "::error file=sociomedia/ec2/hide-ui.css::$class is not in the built main.css"
              missing=1
            fi
          done
          exit "$missing"

      # sociomedia/ec2/brand-symbols.svg は本家のロゴ部品 (<symbol id>) を同じ id で
      # 上書きする。本家が id を変えると黙って元のロゴに戻るので、ここで止める。
      - name: Check brand-symbols.svg ids
        run: |
          missing=0
          for id in $(grep -oE '<symbol id="[^"]+"' sociomedia/ec2/brand-symbols.svg | cut -d'"' -f2 | sort -u); do
            if ! grep -qF -- "id=\"$id\"" ./bundles/frontend/index.html; then
              echo "::error file=sociomedia/ec2/brand-symbols.svg::$id is not in the built index.html"
              missing=1
            fi
          done
          exit "$missing"

      - name: Stage bundles for docker build
        run: |
          for image in frontend backend exporter mcp; do
            rsync -a --delete "./bundles/$image/" "./docker/images/bundle-$image/"
          done

      # ベースイメージ (dhi.io) の取得には Docker Hub アカウントでのログインが必要。
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hardened Images registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/images/
          file: ./docker/images/Dockerfile.frontend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_PREFIX }}/frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/images/
          file: ./docker/images/Dockerfile.backend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_PREFIX }}/backend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push exporter
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/images/
          file: ./docker/images/Dockerfile.exporter
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_PREFIX }}/exporter:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=exporter
          cache-to: type=gha,scope=exporter,mode=max

      - name: Build and push mcp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/images/
          file: ./docker/images/Dockerfile.mcp
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_PREFIX }}/mcp:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy script via SSM
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "$SSM_DOCUMENT" \
            --comment "penpot deploy $VERSION" \
            --parameters "$(jq -nc --arg tag "$VERSION" '{tag: [$tag]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for i in $(seq 1 130); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          # リポジトリが public で Actions のログは誰でも読めるため、deploy.sh 自身の
          # 進行メッセージ (===, >>, !!) だけを表示する。全文は EC2 の deploy.log にある。
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text \
            | grep -E '^(===|>>|!!) ' || true
          echo "Full log: /home/ubuntu/penpot/deploy.log on the EC2 instance"

          echo "### Deploy \`$VERSION\`: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ]
